name: Bean
options:
  bundleIdPrefix: dev.rayanbn
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
targets:
  Bean:
    type: application
    platform: macOS
    sources: [Bean]
    info:
      path: Bean/Info.plist
      properties:
        LSUIElement: true
        CFBundleDisplayName: Bean
        NSScreenCaptureUsageDescription: Bean looks at your screen only after it decides it can help.
        NSAppleEventsUsageDescription: Bean acts in other apps when you ask it to.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.rayanbn.Bean
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        ENABLE_HARDENED_RUNTIME: NO
        GENERATE_INFOPLIST_FILE: NO
