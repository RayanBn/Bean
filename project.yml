name: Bean
options:
  bundleIdPrefix: dev.rayanbn
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
packages:
  MCP:
    url: https://github.com/modelcontextprotocol/swift-sdk
    exactVersion: 0.12.1
targets:
  Bean:
    type: application
    platform: macOS
    sources: [Bean]
    dependencies:
      - package: MCP
    info:
      path: Bean/Info.plist
      properties:
        LSUIElement: true
        CFBundleDisplayName: Bean
        NSScreenCaptureUsageDescription: Bean looks at your screen only after it decides it can help.
        NSAppleEventsUsageDescription: Bean acts in other apps when you ask it to.
        NSAudioCaptureUsageDescription: Bean transcribes a call only after you say yes, to start its follow-up.
        NSMicrophoneUsageDescription: Bean hears your side of a call only after you say yes, to start its follow-up.
        BeanSourceRoot: $(SRCROOT)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.rayanbn.Bean
        CODE_SIGN_IDENTITY: "Bean Local Signing"
        CODE_SIGN_STYLE: Manual
        ENABLE_HARDENED_RUNTIME: NO
        GENERATE_INFOPLIST_FILE: NO
