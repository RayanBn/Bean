name: Bean
options:
  bundleIdPrefix: dev.rayanbn
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
packages:
  MCP:
    url: https://github.com/modelcontextprotocol/swift-sdk
    exactVersion: 0.12.1
targets:
  Bean:
    type: application
    platform: macOS
    sources: [Bean]
    dependencies:
      - package: MCP
    info:
      path: Bean/Info.plist
      properties:
        LSUIElement: true
        CFBundleDisplayName: Bean
        BeanSourceRoot: $(SRCROOT)
        NSMicrophoneUsageDescription: Bean hears your side of a call only after you say yes, to take notes for the agent on that window.
        NSAudioCaptureUsageDescription: Bean hears the other side of a call only after you say yes, to take notes for the agent on that window.
        NSAppleEventsUsageDescription: Bean uses an app's own scripting to do what you asked in that app, in the background.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.rayanbn.Bean
        CODE_SIGN_IDENTITY: "Bean Local Signing"
        CODE_SIGN_STYLE: Manual
        ENABLE_HARDENED_RUNTIME: NO
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
