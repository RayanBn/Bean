name: Bean
options:
  bundleIdPrefix: dev.rayanbn
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
packages:
  MCP:
    url: https://github.com/modelcontextprotocol/swift-sdk
    exactVersion: 0.12.1
targets:
  Bean:
    type: application
    platform: macOS
    sources: [Bean]
    preBuildScripts:
      - name: Fetch ONNX Runtime
        script: "\"$SRCROOT/scripts/fetch-onnxruntime.sh\""
        basedOnDependencyAnalysis: false
    dependencies:
      - package: MCP
      - framework: Vendor/onnxruntime/lib/libonnxruntime.1.dylib
        embed: true
        codeSign: true
    info:
      path: Bean/Info.plist
      properties:
        LSUIElement: true
        CFBundleDisplayName: Bean
        NSScreenCaptureUsageDescription: Bean looks at your screen only after it decides it can help.
        NSAppleEventsUsageDescription: Bean acts in other apps when you ask it to.
        NSAudioCaptureUsageDescription: Bean transcribes a call only after you say yes, to start its follow-up.
        NSMicrophoneUsageDescription: Bean hears your side of a call only after you say yes, to start its follow-up.
        BeanSourceRoot: $(SRCROOT)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.rayanbn.Bean
        CODE_SIGN_IDENTITY: "Bean Local Signing"
        CODE_SIGN_STYLE: Manual
        ENABLE_HARDENED_RUNTIME: NO
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        SWIFT_OBJC_BRIDGING_HEADER: Bean/Features/StreamGuard/OnnxRuntime.h
        HEADER_SEARCH_PATHS: $(SRCROOT)/Vendor/onnxruntime/include
        LIBRARY_SEARCH_PATHS: $(SRCROOT)/Vendor/onnxruntime/lib
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"
